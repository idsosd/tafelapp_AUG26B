<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="row">
        <div class="col">
            <div class="card text-center">
                <div class="card-header">
                    Tafel van ...
                </div>
                <div class="card-body">
                    <div class="row g-3 align-items-center">
                        <div class="col">
                            <label for="inputTafel" class="col-form-label">Welke tafel?</label>
                        </div>
                        <div class="col">
                            <input type="number" id="inputTafel" class="form-control">
                        </div>
                        <div class="col">
                            <a href="#" class="btn btn-success" onclick="showTafel()">GO!</a>
                        </div>
                    </div>
                    <p class="card-text" id="outputTafel">
                    </p>

                </div>
                <div class="card-footer text-body-secondary">
                    Made by OSD
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card text-center">
                <div class="card-header">
                    Tafel oefenen
                </div>
                <div class="card-body">
                    <div class="row g-3 align-items-center">
                        <div class="col">
                            <label for="inputTafelOefen" class="col-form-label">Welke tafel?</label>
                        </div>
                        <div class="col">
                            <input type="number" id="inputTafelOefen" class="form-control">
                        </div>
                        <div class="col">
                            <a href="#" class="btn btn-success" onclick="showOpgave()">GO!</a>
                        </div>
                    </div>
                    <p class="card-text" id="outputOpgave">
                    </p>
                    <p class="card-text" id="outputFeedback">
                    </p>

                </div>
                <div class="card-footer text-body-secondary">
                    Made by OSD
                </div>
            </div>
        </div>
        <div class="col"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="tafelapp.js"></script>
</body>

</html>
